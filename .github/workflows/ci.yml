name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ai-company/api types
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Inspect hosted Node executable pin inputs
        run: |
          pnpm exec node --input-type=module -e '
            import { lstatSync, realpathSync } from "node:fs";
            import { dirname } from "node:path";
            const path = realpathSync(process.execPath);
            const stat = lstatSync(path);
            console.log(JSON.stringify({ execPath: process.execPath, path, version: process.version,
              processUid: process.getuid(), ownerUid: stat.uid, mode: (stat.mode & 0o777).toString(8),
              isFile: stat.isFile(), isSymlink: stat.isSymbolicLink() }));
            for (let current = dirname(path); ; current = dirname(current)) {
              const parent = lstatSync(current);
              console.log(JSON.stringify({ directory: current, isDirectory: parent.isDirectory(),
                isSymlink: parent.isSymbolicLink() }));
              if (dirname(current) === current) break;
            }
          '
      - run: pnpm test:operator
      - run: node handoff/c1-a2/operator/secret-safety.mjs
      - run: node handoff/c1-a2/operator/c1-runner.mjs --verify-bundle
      - run: python3 scripts/test-migrations.py
      - run: python3 scripts/test-d1-preflight.py
      - run: python3 scripts/test-staging-bootstrap.py
      - run: python3 scripts/d1_preflight.py manifest
      - run: python3 scripts/d1_preflight.py config
      # Local bundle/config validation only; no credentials exist in CI and nothing is deployed.
      - run: pnpm --filter @ai-company/api exec wrangler deploy --dry-run --config wrangler.staging.jsonc --outdir "$RUNNER_TEMP/staging-dry-run"
        env:
          WRANGLER_SEND_METRICS: "false"
